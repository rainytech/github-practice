; Audio Equipment Tracker - settings
; Edit this file in Notepad. Lines starting with ; are comments.

[tracker]
; Folder where Google Photos / Google Drive puts your screenshots.
; The tracker only READS this folder. It never moves, renames or deletes anything in it.
screenshot_folder = C:\Users\Admin\Desktop\fb market screenshot

; Where the database, thumbnails, backups and exports are kept.
; "data" means the data folder next to this file.
data_folder = data

; Local web page port. If it is busy, the next free port is used.
port = 8765

; Open the catalogue in your browser automatically (yes / no).
open_browser = yes

[transport]
; Porter transport estimate. Items are delivered to:
home = Puthiyakavu, Tripunithura
; Or give the exact position instead (from Google Maps, right-click your house):
; home_lat = 9.9345
; home_lon = 76.3470

; Straight-line distance x this = road distance estimate
road_factor = 1.3

; Real Porter TWO-WHEELER fares you paid (place fare; place fare ...).
; The fare formula is learned from these plus every "Porter fare" you type on a card.
two_wheeler_fares = Tripunithura 60; Thevara 126; Aluva 300

; Rough multipliers used only until you type a real fare for these vehicles
three_wheeler_multiplier = 2.5
mini_truck_multiplier = 3.5

; Extra charge added to every estimate (e.g. loading help), in rupees
loading_charge = 0

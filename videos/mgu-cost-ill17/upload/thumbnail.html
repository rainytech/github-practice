<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: "Inter Display", "Inter", sans-serif; background: #0B1B3F; position: relative; }
.bg { position: absolute; inset: 0; background: radial-gradient(circle at 78% 45%, #1F3F86 0, #0B1B3F 62%); }
.tag { position: absolute; left: 44px; top: 36px; background: #CC0000; color: #fff; font-weight: 900; font-size: 38px; padding: 8px 22px; border-radius: 10px; letter-spacing: 1px; }
.h1 { position: absolute; left: 44px; top: 128px; width: 760px; color: #fff; font-weight: 900; font-size: 122px; white-space: nowrap; line-height: 0.98; letter-spacing: -2px; text-shadow: 0 6px 0 rgba(0,0,0,0.35); }
.h1 .y { color: #F5B700; }
.sub { position: absolute; left: 44px; top: 400px; color: #fff; font-weight: 800; font-size: 44px; line-height: 1.3; }
.sub b { color: #F5B700; }
.card { position: absolute; left: 790px; top: 110px; width: 450px; background: #FFFDF5; border-radius: 26px; padding: 26px 30px; transform: rotate(3deg); box-shadow: 0 20px 40px rgba(0,0,0,0.5); border-left: 18px solid #6A0DAD; }
.card .k { font-weight: 900; font-size: 36px; color: #6A0DAD; }
.card .big { font-weight: 900; font-size: 96px; line-height: 1; color: #0B1B3F; letter-spacing: -3px; }
.card .big span { color: #1E8E3E; }
.card .no { font-weight: 900; font-size: 64px; color: #CC0000; text-decoration: line-through; text-decoration-thickness: 8px; margin-top: 4px; }
.price { position: absolute; left: 820px; top: 470px; background: #F5B700; color: #0B1B3F; font-weight: 900; font-size: 76px; padding: 6px 28px; border-radius: 18px; transform: rotate(-3deg); box-shadow: 0 14px 30px rgba(0,0,0,0.45); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: #F5B700; display: flex; align-items: center; padding: 0 44px; gap: 22px; }
.bar img { width: 78px; height: 78px; }
.bar .t { font-weight: 900; font-size: 44px; color: #0B1B3F; }
</style></head><body>
<div class="bg"></div>
<div class="tag">MGU B.Com Hons · Sem 6</div>
<div class="h1">NEW MODEL<br><span class="y">PRICE?</span></div>
<div class="sub">All overhead rates changed!<br><b>Illustration 17</b> · Tender &amp; Quotations</div>
<div class="card"><div class="k">Factory OH up 20%</div><div class="big">60→<span>72%</span></div><div class="no">not 80%</div></div>
<div class="price">₹ 30,677</div>
<div class="bar"><img src="../assets/img/logo.png" alt=""><span class="t">COST ACCOUNTING · Dr. Jayan</span></div>
</body></html>

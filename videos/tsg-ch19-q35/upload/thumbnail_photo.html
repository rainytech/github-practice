<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: "Inter Display", "Inter", sans-serif; background: radial-gradient(circle at 30% 50%, #2A3F8F 0, #0F1C4D 70%); position: relative; }
/* left text */
.tag { position: absolute; left: 48px; top: 48px; background: #E8735A; color: #fff; font-weight: 900; font-size: 28px; padding: 6px 18px; border-radius: 10px; }
.h1 { position: absolute; left: 48px; top: 120px; color: #fff; font-weight: 900; font-size: 76px; z-index: 5; line-height: 1.3; letter-spacing: -2px; text-shadow: 0 6px 0 rgba(0,0,0,0.35); }
.h1 .y { color: #F5B700; }
.trap { position: absolute; left: 48px; top: 362px; z-index: 5; background: #FFFDF5; color: #0F1C4D; border-left: 14px solid #E8735A; border-radius: 12px; padding: 10px 22px; font-weight: 900; font-size: 32px; transform: rotate(-2deg); }
.trap span { color: #CC0000; }
.chip { position: absolute; left: 48px; top: 470px; z-index: 5; background: #1E8E3E; color: #fff; font-weight: 900; font-size: 32px; padding: 6px 24px; border-radius: 14px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #F5B700; display: flex; align-items: center; padding: 0 44px; gap: 20px; }
.bar img { width: 74px; height: 74px; } .bar .bt { font-weight: 900; font-size: 42px; color: #0F1C4D; }
/* 3D book */
.scene { position: absolute; left: 950px; top: 14px; transform: scale(0.58) rotate(6deg); z-index: 1; transform-origin: top center; width: 400px; height: 560px; perspective: 1400px; }
.book { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-28deg) rotateX(4deg); }
.front, .spine, .pages { position: absolute; top: 0; height: 560px; }
.front { left: 0; width: 400px; background: #1F2F6B; border-radius: 4px 10px 10px 4px; overflow: hidden; box-shadow: 30px 30px 50px rgba(0,0,0,0.55); }
.spine { left: 0; width: 70px; background: #C9503A; transform-origin: left center; transform: rotateY(90deg) translateZ(0) translateX(-70px); display: flex; align-items: center; justify-content: center; }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); color: #fff; font-weight: 900; font-size: 30px; letter-spacing: 2px; white-space: nowrap; }
.pages { right: 0; width: 60px; background: repeating-linear-gradient(90deg, #f3efe4 0 2px, #dcd6c6 2px 3px); transform-origin: right center; transform: rotateY(-90deg) translateX(60px); top: 6px; height: 548px; }
.tiles { display: grid; grid-template-columns: repeat(4, 100px); }
.t { width: 100px; height: 100px; position: relative; overflow: hidden; }
.c { position: absolute; border-radius: 50%; } .sq { position: absolute; }
.cov { padding: 18px 26px; color: #fff; }
.cov .k { font-size: 20px; font-weight: 800; color: #F5B700; letter-spacing: 1px; }
.cov .ti { font-size: 52px; font-weight: 900; line-height: 1; margin-top: 6px; }
.cov .ti2 { font-size: 40px; font-weight: 900; color: #F5B700; line-height: 1.05; }
.cov .sm { font-size: 18px; font-weight: 700; margin-top: 8px; color: #D7DEF5; }
.logo { position: absolute; right: 18px; bottom: 112px; width: 70px; height: 70px; border-radius: 50%; background: #fff; padding: 3px; }
.me { position: absolute; right: -20px; bottom: 96px; height: 480px; z-index: 3; filter: drop-shadow(0 0 28px rgba(10,20,60,0.55)); }
.bar { z-index: 6; }
</style></head><body>
<div class="tag">CBSE Class 11 · 2026–27</div>
<div class="h1">T.S. GREWAL<br><span class="y">Q35 SOLVED</span></div>
<div class="trap"><span>1 HIDDEN</span> adjustment</div>
<div class="chip">₹ 2,19,050 ✓ Tallied</div>
<img class="me" src="../../../tools/thumb/rainy_soft.png" alt="">
<div class="scene"><div class="book">
  <div class="pages"></div>
  <div class="spine"><span>GOODWILL SOLVED NOTES</span></div>
  <div class="front">
    <div class="tiles">
      <div class="t" style="background:#E8735A"><div class="c" style="left:20px;top:20px;width:60px;height:60px;background:#F7C8B4"></div></div>
      <div class="t" style="background:#8FA3C0"><div class="sq" style="left:30px;top:30px;width:40px;height:40px;background:#1F2F6B"></div></div>
      <div class="t" style="background:linear-gradient(135deg,#F7C8B4 50%,#C9503A 50%)"></div>
      <div class="t" style="background:#5B6E96"><div class="c" style="left:-50px;top:50px;width:100px;height:100px;background:#E8735A"></div></div>
    </div>
    <div class="cov">
      <div class="k">GOODWILL SOLVED NOTES · CLASS XI</div>
      <div class="ti">Final Accounts</div>
      <div class="ti2">with Adjustments</div>
      <div class="sm">T.S. Grewal Q35 · Rainy Goodwill</div>
    </div>
    <div class="tiles" style="position:absolute;bottom:0">
      <div class="t" style="background:#F7C8B4"><div class="c" style="left:15px;top:15px;width:70px;height:70px;border:14px solid #C9503A"></div></div>
      <div class="t" style="background:linear-gradient(45deg,#8FA3C0 50%,#E8735A 50%)"></div>
      <div class="t" style="background:#C9503A"><div class="sq" style="left:25px;top:25px;width:50px;height:50px;background:#F7C8B4"></div></div>
      <div class="t" style="background:#1F2F6B"><div class="c" style="left:10px;top:10px;width:80px;height:80px;border:12px solid #8FA3C0"></div></div>
    </div>
    <img class="logo" src="../assets/img/logo.png" alt="">
  </div>
</div></div>
<div class="bar"><img src="../assets/img/logo.png" alt=""><span class="bt">RAINY GOODWILL · ACCOUNTANCY</span></div>
</body></html>

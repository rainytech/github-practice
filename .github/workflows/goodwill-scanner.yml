name: Build Goodwill Scanner APK

on:
  push:
    paths:
      - "goodwill-scanner/**"
      - ".github/workflows/goodwill-scanner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goodwill-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk GoodwillScanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoodwillScanner
          path: goodwill-scanner/GoodwillScanner.apk
      - name: Publish release (phone-friendly download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scanner-build-${{ github.run_number }}
          name: Goodwill Scanner build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: goodwill-scanner/GoodwillScanner.apk
          body: Download GoodwillScanner.apk on the phone and install it.
